apply plugin: 'com.android.application'

android {
    namespace "com.example.ytwebview"
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.example.ytwebview"
        minSdkVersion 19
        targetSdkVersion 19
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Intentionally empty: no AndroidX, AppCompat or third-party libraries.
}
